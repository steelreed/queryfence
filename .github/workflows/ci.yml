name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  compatibility:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: JUnit 5.13 (latest 5.x)
            flags: -Djunit.version=5.13.4
          - label: JUnit 6.1 + Spring Boot 4
            flags: -Djunit.version=6.1.3 -Dspring.version=7.0.9 -Dspring-boot.version=4.1.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test the JUnit and Spring modules
        run: ./mvnw -B -ntp -pl queryfence-junit5,queryfence-spring-test -am test ${{ matrix.flags }}

  integration:
    name: Integration tests (MySQL + Postgres)
    runs-on: ubuntu-latest
    # Six Spring contexts and two database containers: run it where it gates a merge.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # The examples point at localhost; these services stand in for `docker compose up`.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shop
          MYSQL_USER: shop
          MYSQL_PASSWORD: shop
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ushop -pshop"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U billing"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Hibernate, MyBatis and JdbcTemplate against real databases
        run: ./mvnw -B -ntp -pl queryfence-integration-tests -am -Pintegration verify

      - name: The examples still demonstrate a blocked build
        run: ./examples/verify-examples.sh

  mutation:
    name: Mutation testing (JDK 21)
    runs-on: ubuntu-latest
    # Mutation analysis takes minutes: run it where it gates a merge, not on every branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: PIT mutation coverage of the rule engine
        run: ./mvnw -B -ntp -pl queryfence-core -Pmutation verify
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pit-report
          path: queryfence-core/target/pit-reports
          if-no-files-found: ignore
