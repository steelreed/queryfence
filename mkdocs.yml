site_name: QueryFence
site_description: SQL policy testing for the JVM. Catch tenant leaks in your integration tests.
site_url: https://steelreed.github.io/queryfence/
repo_url: https://github.com/steelreed/queryfence
repo_name: steelreed/queryfence
edit_uri: edit/main/docs/
copyright: Apache-2.0 &middot; part of Steelreed

theme:
  name: material
  logo: assets/queryfence.svg
  favicon: assets/queryfence.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - navigation.footer
    - toc.follow
    - content.code.annotate

extra:
  generator: false
  homepage: https://steelreed.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/steelreed/queryfence
      name: QueryFence on GitHub
    - icon: material/web
      link: https://steelreed.com
      name: Steelreed

extra_css:
  - assets/steelreed.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started.md
      - Adopting in an existing project: ADOPTION.md
  - How It Works:
      - how-it-works.md
      - Design notes: DESIGN.md
  - Rules: rules.md
  - Integrations: integrations.md
  - Configuration: configuration.md
  - Suppressions: suppressions.md
  - CI: ci.md
  - Comparison: comparison.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Releasing: RELEASE.md

not_in_nav: |
  decisions/
  upstream-issues/
