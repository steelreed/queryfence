cases:
  - id: subquery-001
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND EXISTS (SELECT 1 FROM order_item i WHERE i.order_id = o.id AND i.tenant_id = ?)
    expect: []
    reason: 'The outer block and the EXISTS block each fence their own occurrence.'

  - id: subquery-002
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND EXISTS (SELECT 1 FROM order_item i WHERE i.order_id = o.id)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'An EXISTS subquery is its own block and needs its own tenant predicate.'

  - id: subquery-003
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND o.id IN (SELECT i.order_id FROM order_item i WHERE i.sku = ?)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'A subquery is its own block and the outer tenant predicate does not fence order_item inside it.'

  - id: subquery-004
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND o.id IN (SELECT i.order_id FROM order_item i WHERE i.tenant_id = ?)
    expect: []
    reason: 'The same query passes once the subquery filters by tenant.'

  - id: subquery-005
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id, (SELECT COUNT(*) FROM invoice v WHERE v.order_id = o.id) AS invoice_count
      FROM purchase_order o WHERE o.tenant_id = ?
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'A scalar subquery in the SELECT list is its own block and its invoice occurrence is unfenced.'

  - id: subquery-006
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id, (SELECT COUNT(*) FROM invoice v WHERE v.order_id = o.id AND v.tenant_id = ?) AS invoice_count
      FROM purchase_order o WHERE o.tenant_id = ?
    expect: []
    reason: 'The scalar subquery passes once it filters by tenant.'

  - id: subquery-007
    clause: [RP-3, RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND EXISTS (SELECT 1 FROM order_item i WHERE i.order_id = o.id AND i.tenant_id = o.tenant_id)
    expect: []
    reason: 'A correlated tenant-column equality anchors i on the fenced outer occurrence o.'

  - id: subquery-008
    clause: [RP-3, RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.status = ?
      AND EXISTS (SELECT 1 FROM order_item i WHERE i.order_id = o.id AND i.tenant_id = o.tenant_id)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: purchase_order
        alias: o
        message: 'purchase_order (o) has no tenant filter. Add "o.tenant_id = ?" to the WHERE clause of the query block that uses it.'
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'The correlated equality fences nothing when the outer occurrence is itself unfenced.'

  - id: subquery-009
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      GROUP BY o.id HAVING COUNT(*) > (SELECT COUNT(*) FROM order_item i)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in HAVING are checked like any other subquery.'

  - id: subquery-010
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      AND EXISTS (SELECT 1 FROM order_item i WHERE i.tenant_id = ?
        AND EXISTS (SELECT 1 FROM invoice v WHERE v.order_id = i.order_id))
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Nesting is unlimited: the innermost block is checked too.'

  - id: subquery-011
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      ORDER BY (SELECT MAX(v.amount) FROM invoice v)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in ORDER BY are blocks too.'

  - id: subquery-012
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT * FROM purchase_order o WHERE o.tenant_id = ?
      LIMIT (SELECT COUNT(*) FROM purchase_order)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: purchase_order
        alias: null
        message: 'purchase_order has no tenant filter. Add "purchase_order.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in LIMIT are blocks too.'

  - id: subquery-013
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT * FROM purchase_order o WHERE o.tenant_id = ?
      LIMIT (SELECT COUNT(*) FROM purchase_order p WHERE p.tenant_id = ?)
    expect: []
    reason: 'A fenced subquery in LIMIT passes.'

  - id: subquery-014
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT * FROM purchase_order o WHERE o.tenant_id = ?
      OFFSET (SELECT COUNT(*) FROM invoice v) ROWS
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in OFFSET are blocks too.'

  - id: subquery-015
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT * FROM purchase_order o WHERE o.tenant_id = ?
      FETCH FIRST (SELECT COUNT(*) FROM invoice v) ROWS ONLY
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in FETCH FIRST are blocks too.'

  - id: subquery-016
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT DISTINCT ON ((SELECT MAX(v.id) FROM invoice v)) o.id
      FROM purchase_order o WHERE o.tenant_id = ?
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in DISTINCT ON are blocks too.'

  - id: subquery-017
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT o.id, ROW_NUMBER() OVER w FROM purchase_order o WHERE o.tenant_id = ?
      WINDOW w AS (ORDER BY (SELECT MAX(v.amount) FROM invoice v WHERE v.order_id = o.id))
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in a WINDOW definition are blocks too.'

  - id: subquery-018
    clause: [RP-7]
    policy: default
    dialect: ansi
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      START WITH o.id IN (SELECT i.order_id FROM order_item i)
      CONNECT BY PRIOR o.id = o.parent_id
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in START WITH and CONNECT BY are blocks too.'

  - id: subquery-019
    clause: [RP-7, RP-10]
    policy: default
    dialect: postgres
    sql: |-
      UPDATE purchase_order SET status = ? WHERE tenant_id = ?
      RETURNING (SELECT COUNT(*) FROM invoice v WHERE v.order_id = purchase_order.id)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in RETURNING read rows and are checked.'

  - id: subquery-020
    clause: [RP-7, RP-8]
    policy: default
    dialect: postgres
    sql: |-
      SELECT o.id FROM purchase_order o WHERE o.tenant_id = ?
      UNION SELECT v.order_id FROM invoice v WHERE v.tenant_id = ?
      LIMIT (SELECT COUNT(*) FROM order_item i)
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: order_item
        alias: i
        message: 'order_item (i) has no tenant filter. Add "i.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in the LIMIT of a set operation are blocks too.'

  - id: subquery-021
    clause: [RP-7]
    policy: default
    dialect: mysql
    sql: |-
      SELECT * FROM purchase_order o WHERE o.tenant_id = ?
      LIMIT (SELECT COUNT(*) FROM invoice v), 10
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in the offset of a MySQL LIMIT are blocks too.'

  - id: subquery-022
    clause: [RP-7]
    policy: default
    dialect: postgres
    sql: |-
      SELECT o.id, ROW_NUMBER() OVER w FROM purchase_order o WHERE o.tenant_id = ?
      WINDOW w AS (PARTITION BY (SELECT MAX(v.id) FROM invoice v))
    expect:
      - rule: tenant-isolation
        code: MISSING_PREDICATE
        table: invoice
        alias: v
        message: 'invoice (v) has no tenant filter. Add "v.tenant_id = ?" to the WHERE clause of the query block that uses it.'
    reason: 'Subqueries in the PARTITION BY of a WINDOW definition are blocks too.'
